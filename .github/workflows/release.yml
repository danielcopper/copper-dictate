name: Release

# Two jobs: release-please decides the version, the tag and the changelog, and
# `assets` attaches what a tag is worth downloading —
# `copper-dictate-<tag>-x86_64-linux.tar.gz` and its `.sha256`.
#
# The archive is packed from the tag by the same `scripts/package.sh` every
# PR's build job already runs, so a release is not the first place the
# packager is exercised.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a GitHub App installation token so release-please's PR/branch
      # pushes are authored by the App, not GITHUB_TOKEN. Pushes made with
      # GITHUB_TOKEN do not trigger workflows (anti-recursion), which leaves
      # the release PR's required status checks stuck "Expected" and
      # unmergeable. An App token makes those checks run automatically.
      # Scope it to exactly what release-please needs (contents + PRs).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds from the TAG rather than from anything the job above left behind: a
  # tag is the one thing about a release that is fixed, so the archive is
  # reproducible from it alone and no artifact has to be carried between two
  # workflows to make that true.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: write` is all that attaching an asset needs. The App token
    # stays with release-please, which is the job that has to author commits.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # No cache: a release builds from nothing but the tag.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Build the release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      # The tag is passed in so the packager holds it against the version
      # release-please stamped into Cargo.toml on this tag.
      - name: Pack the archive and check it
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/package.sh build "$TAG" target/x86_64-unknown-linux-gnu/release/copper-dictate

      # `--clobber` makes a re-run of this job harmless.
      - name: Attach the archive and its checksum to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/copper-dictate-$TAG-x86_64-linux.tar.gz" "build/copper-dictate-$TAG-x86_64-linux.tar.gz.sha256" --clobber

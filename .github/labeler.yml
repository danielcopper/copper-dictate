# Path-to-label mapping for actions/labeler.
#
# Every label listed here must exist in the repository (`gh label list`).

area:client:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

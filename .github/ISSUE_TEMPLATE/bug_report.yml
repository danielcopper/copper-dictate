name: Bug report
description: Report a bug in copper-dictate
title: "bug: "
labels: ["bug"]
assignees: ["danielcopper"]
body:
  - type: markdown
    attributes:
      value: |
        Required fields are the minimum for triage. Optional fields make things significantly easier to act on — please fill what you can, but **don't skip the report just because you can't fill everything**.

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What actually happened. Include error messages verbatim if any.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: copper-dictate version
      description: "`copper-dictate --version` prints it. Required for triage."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Numbered steps that reproduce the bug from a known-good state. Even a one-line description of what you were doing helps.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen. Skip if it's obvious from "What happened".
    validations:
      required: false

  - type: input
    id: desktop
    attributes:
      label: Desktop and session
      description: The desktop environment and its version, and whether the session is Wayland or X11. If you can't find it quickly, leave blank.
      placeholder: "KDE Plasma 6.5, Wayland"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Any output copper-dictate printed around the problem, verbatim.
      render: text
    validations:
      required: false

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only: each lets the binary ship under MIT with the notices
# kept, which scripts/package.sh writes into the archive with cargo about. Keep
# this list equal to `accepted` in about.toml.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
    { crate = "syn@2.0.119", reason = "enumflags2_derive, the build-time derive macro of reis, is still on syn 2 beside the syn 3 of the rest" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

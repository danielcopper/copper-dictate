[package]
name = "copper-dictate"
version = "0.1.0"
edition = "2024"
description = "Self-hosted live dictation for Linux desktops"
license = "MIT"
repository = "https://github.com/danielcopper/copper-dictate"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
futures-core = "0.3"
reis = "0.7"
rustix = { version = "1", features = ["event", "time"] }
# ring, not aws-lc-rs: aws-lc-sys carries the OpenSSL licence, which deny.toml rejects.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The platform verifier, not webpki-roots: that crate's CDLA-Permissive-2.0 licence is not in deny.toml.
ureq = { version = "3", default-features = false, features = ["platform-verifier", "rustls-no-provider"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Without the default tracing feature, whose proc-macro is still on syn 2 beside the syn 3 of the rest.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
strip = true

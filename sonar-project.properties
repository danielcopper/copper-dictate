sonar.projectKey=danielcopper_copper-dictate
sonar.organization=danielcopper

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the job
# that ran the scan fails with it. Which job scans which PR, and which check
# blocks the merge, is in the comment on the `sonarcloud` job in
# .github/workflows/ci.yml.
sonar.qualitygate.wait=true

# Sources
# The unit tests sit beside the code they test, in `#[cfg(test)]` modules
# inside the files under src/; Sonar tells test code from source code only by
# file, so it counts those as source.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=target/**

# Reports
# Both come from the `test` job in .github/workflows/ci.yml: the coverage of one
# `cargo llvm-cov nextest` run as LCOV, and clippy's findings as JSON.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Coverage
# The modules that talk to the desktop are left out of the coverage measure:
# PRD #4 D13(3) checks them on a real desktop, not by an automated test. The
# rules around them, in the modules beside them, stay measured.
sonar.coverage.exclusions=src/platform/data_control.rs,src/platform/keyboard.rs,src/platform/remote_desktop.rs

# The analyzer's own clippy run. The SonarQube Server 2025.3 docs say the Rust
# analyzer runs clippy over the Cargo.toml it finds unless this is false; the
# current SonarQube Cloud docs say it does not run clippy and no longer name the
# property. Off either way: clippy builds the code it lints, and in the fork
# scan (sonarcloud-fork-pr.yml, which reads this file from main) that code is
# the fork's. Sonar's clippy findings come from the report above.
sonar.rust.clippy.enabled=false

# Suppress false positives
# S7631 flags the fork scan's checkout of the fork's head
# (`allow-unsafe-pr-checkout`). Nothing from that tree is executed, and the
# step "Replace the fork's scanner inputs" strips what could run before the
# scan; the fork scan reads main's copy of this file.
sonar.issue.ignore.multicriteria=fp1
sonar.issue.ignore.multicriteria.fp1.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.fp1.resourceKey=.github/workflows/sonarcloud-fork-pr.yml

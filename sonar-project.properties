sonar.projectKey=danielcopper_copper-dictate
sonar.organization=danielcopper

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the job
# that ran the scan fails with it. Which job scans which PR, and which check
# blocks the merge, is in the comment on the `sonarcloud` job in
# .github/workflows/ci.yml.
sonar.qualitygate.wait=true

# Sources
# The unit tests sit beside the code they test, in `#[cfg(test)]` modules
# inside the files under src/. Sonar tells test code from source code only by
# file, so it counts them as source; no sonar.tests is set until a tests/
# directory of integration tests exists.
sonar.sources=src
sonar.exclusions=target/**

# Reports
# Both come from the `sonarcloud` job in .github/workflows/ci.yml (and, for a
# fork's PR, from `fork-coverage` through sonarcloud-fork-pr.yml): the coverage
# of one `cargo llvm-cov nextest` run as LCOV, and clippy's findings as JSON.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json

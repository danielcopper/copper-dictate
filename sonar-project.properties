sonar.projectKey=danielcopper_copper-dictate
sonar.organization=danielcopper

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the job
# that ran the scan fails with it. Which job scans which PR, and which check
# blocks the merge, is in the comment on the `sonarcloud` job in
# .github/workflows/ci.yml.
sonar.qualitygate.wait=true

# Sources
# The tests that run the binary live in tests/. The unit tests sit beside the
# code they test, in `#[cfg(test)]` modules inside the files under src/; Sonar
# tells test code from source code only by file, so it counts those as source.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=target/**

# Reports
# Both come from the `test` job in .github/workflows/ci.yml, which hands them to
# the `sonarcloud` job there or, for a fork's PR, to sonarcloud-fork-pr.yml: the
# coverage of one `cargo llvm-cov nextest` run as LCOV, and clippy's findings as
# JSON, written with every lint capped at a warning so that a finding reaches
# Sonar instead of ending the run.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json
